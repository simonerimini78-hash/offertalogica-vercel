<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="frame-src 'self'"><meta name="robots" content="noindex,nofollow,noarchive"><title>OffertaLogica – Anteprima mobile Staff</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eeec;color:#17342c;font:14px system-ui,sans-serif}header{padding:10px;text-align:center;background:white;border-bottom:1px solid #cbd5d1}header strong{display:block}nav{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}button,select{font:inherit;border:1px solid #b3c5bc;background:white;color:#17342c;border-radius:6px;min-height:34px;padding:5px 10px;cursor:pointer}#status{min-height:22px;margin:4px;text-align:center;font-size:12px;overflow-wrap:anywhere}#stage{position:relative;display:flex;justify-content:center;align-items:flex-start;min-height:100px;overflow:hidden}#phone{transform-origin:top center;border:8px solid #1d2321;border-radius:34px;background:#fff;overflow:hidden;flex:none;box-shadow:0 10px 25px #0003}iframe{display:block;border:0;background:white;width:390px;height:844px}#blocked{padding:20px;text-align:center}[hidden]{display:none!important}
</style></head><body><header><strong>Anteprima mobile Staff · Tracking commerciale escluso</strong><nav><button id="back" type="button" aria-label="Indietro">←</button><button id="forward" type="button" aria-label="Avanti">→</button><button id="reload" type="button">Ricarica</button><button id="home" type="button">Home</button><select id="size" aria-label="Dimensioni schermo"><option value="390x844">iPhone 390 × 844</option><option value="393x852">iPhone 393 × 852</option><option value="430x932">iPhone 430 × 932</option><option value="375x667">iPhone 375 × 667</option></select><button id="exit" type="button">Chiudi</button></nav><div id="status" role="status" aria-live="polite"></div></header><div id="blocked" hidden>Apri questa anteprima da Verifica sito, dopo aver attivato la modalità Staff.</div><main id="stage" hidden><div id="phone"><iframe id="ol-staff-phone" title="Sito pubblico OffertaLogica, viewport mobile" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads" allow="camera 'self'"></iframe></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),frame=$('ol-staff-phone'),stage=$('stage'),phone=$('phone');let active=false;try{active=sessionStorage.getItem('offertalogicaStaffMode')==='true'&&sessionStorage.getItem('offertalogicaStaffMobilePreview')==='true';}catch(_){}if(!active){$('blocked').hidden=false;return;}
window.OLStaffPhoneNotice=text=>{$('status').textContent=text;};
function fit(){const [w,h]=$('size').value.split('x').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';const scale=Math.min(1,(innerWidth-20)/(w+16),Math.max(120,innerHeight-document.querySelector('header').offsetHeight-14)/(h+16));phone.style.transform='scale('+scale+')';stage.style.height=(h+16)*scale+'px';}
function nav(fn){try{fn(frame.contentWindow);}catch(_){frame.src='/';}}
$('back').onclick=()=>nav(w=>w.history.back());$('forward').onclick=()=>nav(w=>w.history.forward());$('reload').onclick=()=>nav(w=>w.location.reload());$('home').onclick=()=>{frame.src='/';};$('exit').onclick=()=>{window.close();stage.hidden=true;$('blocked').hidden=false;$('blocked').textContent='Verifica terminata. Chiudi la finestra.';};$('size').onchange=fit;window.addEventListener('resize',fit);
frame.addEventListener('load',()=>{try{const w=frame.contentWindow;if(w.location.origin!==location.origin)return;window.OLStaffPhoneNotice(w.location.pathname+w.location.search);}catch(_){window.OLStaffPhoneNotice('Pagina esterna: torna alla Home per continuare la verifica.');}});
// Separate preview state from any earlier test copied by the opener; keep only Staff identity.
try{for(const k of Object.keys(sessionStorage)){if(!['offertalogicaStaffMode','offertalogicaStaffMobilePreview','offertalogicaStaffPreviewProof'].includes(k))sessionStorage.removeItem(k);}}catch(_){}
stage.hidden=false;fit();frame.src=new URLSearchParams(location.search).get('offers')==='1'?'/?landing=0&from=landing&compare_start=average':'/';})();
</script></body></html>
