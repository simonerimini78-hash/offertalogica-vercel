name: Aggiorna offerte ARERA

on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: "Cartella del repository contenente i tre XML E, G e D (vuoto = download automatico)"
        required: false
        default: ""
        type: string
      as_of:
        description: "Data dei file in formato YYYY-MM-DD (vuoto = oggi)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  update-arera-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Genera JSON offerte ARERA
        env:
          SOURCE_DIR: ${{ inputs.source_dir }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          args=()
          if [ -n "$SOURCE_DIR" ]; then
            args+=(--source-dir "$SOURCE_DIR")
          fi
          if [ -n "$AS_OF" ]; then
            args+=(--as-of "$AS_OF")
          fi
          python scripts/update-arera-menu.py "${args[@]}"

      - name: Commit aggiornamento se necessario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offerte-arera-menu.json public/data/offerte-arera-menu.json data/arera-update-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna offerte ARERA"
            git push
          fi
