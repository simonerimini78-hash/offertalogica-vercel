name: Verifica dati OffertaLogica

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/calcolo-parametri.json"
      - "public/data/calcolo-parametri.json"
      - "data/offerte-arera-menu.json"
      - "public/data/offerte-arera-menu.json"
      - "data/arera-update-report.json"
      - "public/data/energia-oggi.json"
      - "public/pun-oggi.html"
      - "public/psv-gas-oggi.html"
      - "scripts/aggiorna-arera-locale-mac.sh"
      - "scripts/update-arera-menu.py"
      - "scripts/update-arera-reference-data.py"
      - "scripts/update-energy-today.py"
      - "scripts/validate-calculator-data.mjs"

permissions:
  contents: read

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Installa dipendenze Node
        run: npm ci

      - name: Test parser ARERA
        run: python test/update_arera_menu_test.py

      - name: Test riferimenti ARERA
        run: python test/update_arera_reference_data_test.py

      - name: Verifica coerenza dati calcolatore
        run: npm run validate:calculator

      - name: Riepilogo
        if: always()
        run: |
          echo "### Verifica dati OffertaLogica" >> "$GITHUB_STEP_SUMMARY"
          echo "- Acquisizione ARERA/GME: eseguita esclusivamente dal Mac" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub: sola validazione dei file già prodotti" >> "$GITHUB_STEP_SUMMARY"
