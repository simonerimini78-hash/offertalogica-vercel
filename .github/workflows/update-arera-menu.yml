name: Aggiorna PUN GME

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Data di controllo in formato YYYY-MM-DD (vuoto = oggi)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  update-pun-gme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa estrattore PDF GME
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v

      - name: Verifica parser e modalità PUN isolata
        run: python -m unittest discover -s test -p "update_arera_menu_test.py"

      - name: Aggiorna soltanto PUN GME
        env:
          AS_OF: ${{ inputs.as_of }}
        run: |
          args=(--pun-only)
          if [ -n "$AS_OF" ]; then
            args+=(--as-of "$AS_OF")
          fi
          python scripts/update-arera-menu.py "${args[@]}"

      - name: Commit aggiornamento PUN se necessario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/calcolo-parametri.json \
            public/data/calcolo-parametri.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna PUN GME"
            git push
          fi
