name: Aggiorna dati OffertaLogica

on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: "Cartella del repository contenente i tre XML E, G e D (vuoto = download automatico)"
        required: false
        default: ""
        type: string
      as_of:
        description: "Data dei file in formato YYYY-MM-DD (vuoto = oggi)"
        required: false
        default: ""
        type: string
  schedule:
    # 17:30 UTC = 19:30 in estate / 18:30 in inverno in Italia.
    # Il bollettino ARERA include anche l'aggiornamento gas del tardo pomeriggio.
    - cron: "30 17 * * *"

permissions:
  contents: write

jobs:
  update-arera-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa lettore PDF per bollettino ARERA
        run: python -m pip install --disable-pip-version-check --quiet pdfplumber

      - name: Genera JSON offerte ARERA
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_DIR: ${{ inputs.source_dir }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          args=()
          if [ -n "$SOURCE_DIR" ]; then
            args+=(--source-dir "$SOURCE_DIR")
          fi
          if [ -n "$AS_OF" ]; then
            args+=(--as-of "$AS_OF")
          fi
          python scripts/update-arera-menu.py "${args[@]}"

      - name: Aggiorna riferimenti energia giornalieri
        id: energia
        continue-on-error: true
        run: python scripts/update-energy-today.py

      - name: Riepilogo aggiornamento energia
        if: always()
        run: |
          if [ "${{ steps.energia.outcome }}" = "success" ]; then
            echo "### Dati energia" >> "$GITHUB_STEP_SUMMARY"
            echo "Aggiornamento giornaliero completato." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Dati energia" >> "$GITHUB_STEP_SUMMARY"
            echo "Aggiornamento non riuscito: i file pubblici energia sono rimasti invariati." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit aggiornamento se necessario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/energia-oggi.json public/pun-oggi.html public/psv-gas-oggi.html public/sitemap.xml
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git add data/offerte-arera-menu.json public/data/offerte-arera-menu.json data/arera-update-report.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna dati OffertaLogica"
            git push
          fi
