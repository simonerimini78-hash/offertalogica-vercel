name: Aggiorna dati OffertaLogica

on:
  workflow_dispatch:
    inputs:
      source_dir:
        description: "Cartella del repository contenente i tre XML E, G e D (vuoto = download automatico)"
        required: false
        default: ""
        type: string
      as_of:
        description: "Data dei file in formato YYYY-MM-DD (vuoto = oggi)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "30 17 * * *"

permissions:
  contents: write

jobs:
  update-arera-menu:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PREMIUM_BRANCH: App-Premium-ok
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa lettore PDF per bollettino ARERA
        run: python -m pip install --disable-pip-version-check --quiet pdfplumber

      - name: Sincronizza indici mensili ufficiali ARERA
        id: indici
        continue-on-error: true
        run: python scripts/update-arera-reference-data.py indices

      - name: Genera JSON offerte ARERA
        id: catalogo
        env:
          SOURCE_DIR: ${{ inputs.source_dir }}
          AS_OF: ${{ inputs.as_of }}
        run: |
          args=()
          if [ -n "$SOURCE_DIR" ]; then
            args+=(--source-dir "$SOURCE_DIR")
          fi
          if [ -n "$AS_OF" ]; then
            args+=(--as-of "$AS_OF")
          fi
          python scripts/update-arera-menu.py "${args[@]}"

      - name: Aggiorna benchmark medio dal catalogo ARERA
        id: benchmark
        run: python scripts/update-arera-reference-data.py benchmark

      - name: Aggiorna riferimenti energia giornalieri
        id: energia
        continue-on-error: true
        run: python scripts/update-energy-today.py

      - name: Verifica coerenza dati calcolatore
        id: verifica
        run: npm run validate:calculator

      - name: Prepara commit MAIN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/calcolo-parametri.json \
            public/data/calcolo-parametri.json \
            data/offerte-arera-menu.json \
            public/data/offerte-arera-menu.json \
            data/arera-update-report.json \
            public/data/energia-oggi.json \
            public/pun-oggi.html \
            public/psv-gas-oggi.html \
            public/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna dati ARERA OffertaLogica"
          fi

      - name: Prepara sincronizzazione Premium
        run: |
          git fetch origin "$PREMIUM_BRANCH"
          rm -rf ../offertalogica-premium-sync
          git worktree add -B premium-data-sync ../offertalogica-premium-sync "origin/$PREMIUM_BRANCH"
          mkdir -p ../offertalogica-premium-sync/public/data
          cp public/data/calcolo-parametri.json ../offertalogica-premium-sync/public/data/calcolo-parametri.json
          cp public/data/offerte-arera-menu.json ../offertalogica-premium-sync/public/data/offerte-arera-menu.json
          cp public/data/offerte-proposte.json ../offertalogica-premium-sync/public/data/offerte-proposte.json
          cp public/index.html ../offertalogica-premium-sync/public/index.html
          cd ../offertalogica-premium-sync
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/data/calcolo-parametri.json public/data/offerte-arera-menu.json public/data/offerte-proposte.json
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizza motore e dati economici Premium"
          fi

      - name: Pubblica MAIN e Premium insieme
        run: |
          git push --atomic origin HEAD:main premium-data-sync:"$PREMIUM_BRANCH"

      - name: Riepilogo aggiornamento
        if: always()
        run: |
          echo "### Aggiornamento OffertaLogica" >> "$GITHUB_STEP_SUMMARY"
          echo "- Indici mensili ARERA: ${{ steps.indici.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Catalogo Portale Offerte: ${{ steps.catalogo.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Benchmark medio ARERA: ${{ steps.benchmark.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dati energia giornalieri: ${{ steps.energia.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Verifica calcolatore: ${{ steps.verifica.outcome }}" >> "$GITHUB_STEP_SUMMARY"
